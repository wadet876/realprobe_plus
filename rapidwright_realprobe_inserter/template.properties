# Required DCP paths
original_dcp=/absolute/path/to/design_wrapper_routed.dcp
# Optional readable EDIF for `original_dcp`.
# If this points at a Vivado `write_edif` export with matching .edn sidecars,
# the wrapper will reuse it. Otherwise `run_inserter.sh` will regenerate a
# complete readable EDIF bundle under the output directory automatically.
# original_readable_edif=/absolute/path/to/design_wrapper_routed.edf
realprobe_dcp=/absolute/path/to/design_1_realprobe_ip_0_0.dcp
bram_ctrl_dcp=/absolute/path/to/design_1_axi_bram_ctrl_0_0.dcp
output_dcp=/absolute/path/to/output/design_with_realprobe.dcp

# Required target hierarchy
top_cell_inst=design_1_i

# Optional instance names inside the target block design
realprobe_instance_name=realprobe_ip_0
bram_ctrl_instance_name=axi_bram_ctrl_0

# Required read-data bus connection
realprobe_data_port=axi_rdata_32b
bram_ctrl_data_port=bram_rddata_a
data_width=32
bus_net_prefix=realprobe_ip_0_axi_rdata_32b

# Optional probe connection via a reconstructed LUT2
# Leave these blank if you only want the data bus insertion.
realprobe_probe_port=
probe_net_name=
lut_parent_hier=
lut_instance_name=ap_done_out_INST_0
lut_equation=O=I0 & I1
lut_input0_net=
lut_input1_net=
lut_output_port=O
